<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>atugcc playground</title>
  </head>
  <body>
    <header class="topbar">
      <span class="brand">atugcc playground</span>
      <span id="lesson-title" class="lesson-title">레슨을 고르세요</span>
      <button id="run" class="primary" disabled title="수정한 탭을 저장하고 빌드·실행 (Ctrl+Enter)">▶ Run</button>
      <button id="stop" disabled>■ Stop</button>
      <span id="status" class="status" aria-live="polite"></span>
      <span class="spacer"></span>
      <span id="health" class="muted"></span>
      <button id="theme" title="라이트/다크 전환">◐</button>
    </header>
    <main class="layout">
      <nav class="sidebar">
        <div class="sidebar-head">
          <span>레슨</span>
          <button id="refresh" class="small" title="레슨 목록 다시 읽기">↻</button>
        </div>
        <div id="tree" class="tree"></div>
      </nav>
      <section class="center">
        <div id="tabs" class="tabs" role="tablist"></div>
        <div id="editor" class="editor"></div>
      </section>
      <section class="right">
        <div class="panel-tabs" role="tablist">
          <button data-panel="readme" class="active">README</button>
          <button data-panel="output">Output</button>
          <button data-panel="diagrams">Diagrams</button>
          <button data-panel="events">Events</button>
        </div>
        <div id="panel-readme" class="panel readme active"></div>
        <div id="panel-output" class="panel output"><pre id="output"></pre></div>
        <div id="panel-diagrams" class="panel diagrams"></div>
        <div id="panel-events" class="panel events"></div>
      </section>
    </main>
    <dialog id="dialog"></dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
