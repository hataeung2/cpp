<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>atugcc playground</title>
  </head>
  <body>
    <header class="topbar">
      <span class="brand">atugcc playground</span>
      <button id="intro" data-i18n="top.intro" data-i18n-title="top.introTitle"></button>
      <span id="lesson-title" class="lesson-title"></span>
      <button id="run" class="primary" disabled data-i18n-title="top.runTitle">▶ Run</button>
      <button id="stop" disabled>■ Stop</button>
      <label class="run-option" data-i18n-title="top.longRunTitle">
        <input type="checkbox" id="long-run" /> <span data-i18n="top.longRun"></span>
      </label>
      <label class="run-option" data-i18n-title="top.meterTitle">
        <span data-i18n="top.meter"></span>
        <select id="meter">
          <option value="wall">wall</option>
          <option value="cpu">cpu</option>
        </select>
      </label>
      <label class="run-option" data-i18n-title="mode.title"><select id="mode"><option value="practice" data-i18n="mode.practice"></option><option value="original" data-i18n="mode.original"></option></select></label>
      <span id="status" class="status" aria-live="polite"></span>
      <span class="spacer"></span>
      <span id="health" class="muted"></span>
      <button id="lang"></button>
      <button id="theme" data-i18n-title="top.themeTitle">◐</button>
    </header>
    <main class="layout" id="layout">
      <nav class="sidebar">
        <div class="sidebar-head">
          <span data-i18n="top.lessons"></span>
          <button id="refresh" class="small" data-i18n-title="top.refreshTitle">↻</button>
        </div>
        <input id="search" type="search" class="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="search.placeholder" data-i18n-title="search.title" />
        <div id="search-count" class="search-count muted" aria-live="polite"></div>
        <div id="tree" class="tree"></div>
      </nav>
      <section class="center">
        <div id="practice-bar" hidden><button id="reset-file" class="small" data-i18n="practice.resetFile" data-i18n-title="practice.resetFileTitle"></button><button id="diff-file" class="small" data-i18n="practice.diff" data-i18n-title="practice.diffTitle"></button><button id="reset-lesson" class="small" data-i18n="practice.resetLesson" data-i18n-title="practice.resetLessonTitle"></button><span id="practice-note"></span></div>
        <div class="tabbar">
          <div id="tabs" class="tabs" role="tablist"></div>
          <button id="wrap-editor" class="small wrap-toggle" aria-pressed="true" data-i18n-title="wrap.editorTitle">↩</button>
        </div>
        <div id="editor" class="editor"></div>
      </section>
      <section class="right">
        <div class="panel-tabs" role="tablist">
          <button data-panel="readme" class="active">README</button>
          <button data-panel="exercises" data-i18n="exercise.tab"></button>
          <button data-panel="output">Output</button>
          <button data-panel="diagrams">Diagrams</button>
          <button data-panel="events">Events</button>
          <button data-panel="timings">Timings</button>
        </div>
        <div id="panel-readme" class="panel readme active"></div>
        <div id="panel-exercises" class="panel exercises"></div>
        <div id="panel-output" class="panel output">
          <div class="panel-head"><button id="wrap-output" class="small wrap-toggle" aria-pressed="true" data-i18n-title="wrap.outputTitle">↩</button></div>
          <pre id="output"></pre>
        </div>
        <div id="panel-diagrams" class="panel diagrams"></div>
        <div id="panel-events" class="panel events"></div>
        <div id="panel-timings" class="panel timings"></div>
      </section>
      <div id="bar-sidebar" class="col-bar" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-title="layout.barTitle"></div>
      <div id="bar-right" class="col-bar" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-title="layout.barTitle"></div>
    </main>
    <dialog id="dialog"></dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
