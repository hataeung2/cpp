# Exercises of this lesson (spec 070-17, 070-18): the README's "연습" items, in the same order.
# The page checks them after every practice run; `py -3 tools/exercises.py check thread_and_log --preset <p>` does the same locally.

[[exercise]]
id       = "change_periods"
title    = "두 워커의 주기를 10ms와 50ms로"
title_en = "Change the two periods to 10 ms and 50 ms"
source   = [{ file = "main.cpp", has = ['milliseconds\s*[({]\s*10\s*[)}]', 'milliseconds\s*[({]\s*50\s*[)}]'] }]
fail_hint    = "4단계의 worker_fast 주기를 std::chrono::milliseconds(10)으로, worker_slow 주기를 std::chrono::milliseconds(50)으로 바꾸세요."
fail_hint_en = "In Step 4, change the period of worker_fast to std::chrono::milliseconds(10) and that of worker_slow to std::chrono::milliseconds(50)."
hint = """
4단계에서 `PeriodicWorker worker_fast{ "WorkerFast", std::chrono::milliseconds(20), … }`의 두 번째 인자가 주기입니다. `worker_slow`도 같은 자리입니다.
바꾼 뒤 Run을 누르고 마지막 두 줄 `WorkerFast total ticks`와 `WorkerSlow total ticks`의 비율을 보세요. 약 200ms 동안 도니 틱 수는 `200 / 주기`에 가깝습니다.
"""
hint_en = """
In Step 4 the second argument of `PeriodicWorker worker_fast{ "WorkerFast", std::chrono::milliseconds(20), … }` is the period. `worker_slow` has it in the same place.
After the change press Run and look at the ratio of the last two lines, `WorkerFast total ticks` and `WorkerSlow total ticks`. They run for about 200 ms, so a tick count is close to `200 / period`.
"""
answer = """
```cpp
PeriodicWorker worker_fast{
    "WorkerFast",
    std::chrono::milliseconds(10),
    …
PeriodicWorker worker_slow{
    "WorkerSlow",
    std::chrono::milliseconds(50),
    …
```
Linux(웹)에서는 `WorkerFast total ticks: 19`, `WorkerSlow total ticks: 3`쯤으로 나옵니다. 약 200ms를 주기로 나눈 값에서 맨 처음 기다림과 마지막 정지 때문에 하나쯤 모자랍니다. 비율은 5:1에 가깝습니다. Windows는 대기가 약 16ms 단위로 움직여서 10ms 워커도 16ms 간격으로 돌고(12틱), 50ms 워커는 3틱이라 비율이 4:1쯤으로 덜 벌어집니다. 주기를 **정확히** 지키는 것은 `sleep_for`나 `wait_for`가 약속하지 않습니다. "적어도 그만큼"만 약속합니다.
확인한 뒤 되돌립니다.
"""
answer_en = """
```cpp
PeriodicWorker worker_fast{
    "WorkerFast",
    std::chrono::milliseconds(10),
    …
PeriodicWorker worker_slow{
    "WorkerSlow",
    std::chrono::milliseconds(50),
    …
```
On Linux (the web) you get about `WorkerFast total ticks: 19` and `WorkerSlow total ticks: 3`: about 200 ms divided by the period, one short because of the first wait and the final stop. The ratio is close to 5:1. On Windows waits move in steps of about 16 ms, so even the 10 ms worker runs every 16 ms (12 ticks) and the 50 ms worker gets 3 ticks, so the ratio is smaller, around 4:1. Neither `sleep_for` nor `wait_for` promises the period **exactly**; they promise only "at least that long".
Reset the file when you are done.
"""

[[exercise]]
id       = "early_stop"
title    = "worker_fast만 100ms에 먼저 멈추기"
title_en = "Stop only worker_fast early, at 100 ms"
# observation: the result is a log line and a tick count that differ from run to run
hint = """
4단계의 `std::this_thread::sleep_for(std::chrono::milliseconds(200))`을 100ms로 줄이고, 그 바로 뒤에 `worker_fast.requestStop();`을 부른 다음 100ms를 더 기다리세요. 기존의 두 `requestStop()` 호출은 그대로 둡니다.
로그에서 `[WorkerFast] worker stopped (total ticks: …)` 줄이 `[WorkerSlow] worker stopped` 줄보다 한참 앞에 나와야 합니다.
"""
hint_en = """
In Step 4 shorten `std::this_thread::sleep_for(std::chrono::milliseconds(200))` to 100 ms, call `worker_fast.requestStop();` right after it, and wait another 100 ms. Leave the two existing `requestStop()` calls as they are.
In the log, the line `[WorkerFast] worker stopped (total ticks: …)` should come well before the line `[WorkerSlow] worker stopped`.
"""
answer = """
```cpp
std::this_thread::sleep_for(std::chrono::milliseconds(100));
worker_fast.requestStop();                                    // 100ms 시점: fast만 멈춤
std::this_thread::sleep_for(std::chrono::milliseconds(100));  // slow는 계속 돈다

worker_fast.requestStop();
worker_slow.requestStop();
```
`worker_fast`의 `worker stopped` 줄이 100ms쯤에 나오고 틱 수가 4에서 멎습니다(Windows는 대기 단위가 커서 3). `worker_slow`는 200ms까지 돌아 6틱입니다. `requestStop()`은 여러 번 불러도 됩니다. 이미 멈춘 워커에 다시 부르는 것은 아무 일도 하지 않습니다. 1단계의 `LegacyWorker`와 달리 `PeriodicWorker`는 대기 중에 깨우므로 멈춤이 즉시입니다.
확인한 뒤 되돌립니다.
"""
answer_en = """
```cpp
std::this_thread::sleep_for(std::chrono::milliseconds(100));
worker_fast.requestStop();                                    // at 100 ms: only fast stops
std::this_thread::sleep_for(std::chrono::milliseconds(100));  // slow keeps running

worker_fast.requestStop();
worker_slow.requestStop();
```
The `worker stopped` line of `worker_fast` appears at about 100 ms and its tick count ends at 4 (3 on Windows, where waits move in larger steps). `worker_slow` runs until 200 ms for 6 ticks. `requestStop()` may be called more than once; calling it again on a worker that has stopped does nothing. Unlike the `LegacyWorker` of Step 1, the `PeriodicWorker` wakes its wait, so it stops at once.
Reset the file when you are done.
"""

[[exercise]]
id       = "warn_every_third"
title    = "세 번째 틱마다 경고 로그 남기기"
title_en = "Write a warning log on every third tick"
source   = [{ file = "main.cpp", has = ['tick\s*%\s*3\s*==\s*0', 'Level::Warn'] }]
expect   = ['\[WARN\]']
fail_hint    = "worker_fast의 람다 안에서 tick % 3 == 0일 때 fast_logger.log(atugcc::core::Level::Warn, …)를 부르세요. 출력에 [WARN] 줄이 나와야 합니다."
fail_hint_en = "Inside the worker_fast lambda, call fast_logger.log(atugcc::core::Level::Warn, …) when tick % 3 == 0. The output must contain a [WARN] line."
hint = """
`worker_fast`의 람다는 이미 `fast_logger`를 캡처합니다. 지금 있는 `Level::Debug` 줄 아래에 `if (tick % 3 == 0) { … }`를 더하고, 그 안에서 `Level::Warn`으로 로그를 남기세요.
틱 번호는 0부터 시작하므로 첫 틱(0)부터 경고가 나옵니다.
"""
hint_en = """
The `worker_fast` lambda already captures `fast_logger`. Below the existing `Level::Debug` line add `if (tick % 3 == 0) { … }` and log with `Level::Warn` inside it.
Tick numbers start at 0, so the warnings start with the first tick (0).
"""
answer = """
```cpp
[&fast_logger](std::size_t tick) {
    fast_logger.log(atugcc::core::Level::Debug, "[WorkerFast] tick {}", tick);
    if (tick % 3 == 0) {
        fast_logger.log(atugcc::core::Level::Warn, "[WorkerFast] tick {} is a multiple of 3", tick);
    }
},
```
출력에 `[WARN] … [WorkerFast] tick 0 is a multiple of 3`, 3, 6, … 줄이 `[DEBUG]` 줄 사이에 섞여 나옵니다. `Logger::log`의 첫 인자 `Level`이 줄의 `[DEBUG]`/`[WARN]` 표시를 정합니다. 레벨로 거르는 기능은 아직 없습니다(모든 레벨이 나옵니다).
확인한 뒤 되돌립니다.
"""
answer_en = """
```cpp
[&fast_logger](std::size_t tick) {
    fast_logger.log(atugcc::core::Level::Debug, "[WorkerFast] tick {}", tick);
    if (tick % 3 == 0) {
        fast_logger.log(atugcc::core::Level::Warn, "[WorkerFast] tick {} is a multiple of 3", tick);
    }
},
```
The output has the lines `[WARN] … [WorkerFast] tick 0 is a multiple of 3`, 3, 6, … mixed among the `[DEBUG]` lines. The `Level` first argument of `Logger::log` decides the `[DEBUG]`/`[WARN]` mark of the line. There is no filtering by level yet (every level is printed).
Reset the file when you are done.
"""

[[exercise]]
id       = "shared_logger"
title    = "공유 Logger와 기능별 Logger 비교"
title_en = "Shared Logger versus one Logger per feature"
# observation: several things to look at (line order, snapshot, flush), no single output line
hint = """
`PeriodicWorker` 생성자의 마지막 인자와 람다의 캡처·호출에 있는 `fast_logger`, `slow_logger`를 모두 `logger`로 바꾸세요(람다가 캡처한 Logger로 틱 줄이 갑니다). 그 뒤 출력 줄이 서로 끊기지 않는지, 마지막 `std::cout` 두 줄이 로그 줄보다 뒤에 나오는지 보세요.
`logger.flush();` 줄을 주석 처리하면 마지막 두 줄(`WorkerFast total ticks: …`)의 자리가 어떻게 바뀌는지 보세요. Logger는 줄을 로그 스레드로 **비동기**로 넘깁니다.
"""
hint_en = """
Change `fast_logger` and `slow_logger` to `logger` everywhere in both workers: the last constructor argument and the lambda's capture and call (the tick lines go to the Logger the lambda captured). Then see whether the output lines stay whole and whether the last two `std::cout` lines come after the log lines.
Comment out the `logger.flush();` line and see where the last two lines (`WorkerFast total ticks: …`) end up. The Logger hands lines to the log thread **asynchronously**.
"""
answer = """
`logger` 하나를 두 워커가 함께 써도 줄은 섞이지 않습니다. 줄을 쓰는 것은 로그 스레드 하나이기 때문입니다. `snapshot()`에는 두 워커의 줄이 시간 순서대로 함께 들어 있습니다. `flush()`를 지우면 `std::cout`으로 직접 찍는 마지막 두 줄이 아직 전달되지 않은 로그 줄보다 **앞에** 나올 수 있습니다(실행마다 다름). `flush()`는 호출 전에 쓴 모든 줄이 나오기를 기다립니다.
기능별 Logger가 여전히 쓸모 있는 까닭은 **설정**입니다. 예를 들어 `Logger::Config{ .liveOutput = &slow_file }`(`slow_file`은 `std::ofstream`)로 만든 `slow_logger`에 느린 워커를 연결하면, 느린 워커의 로그만 파일로 가고 나머지는 화면으로 갑니다. 이력 크기(`bufferCapacity`)도 기능마다 다르게 둘 수 있습니다. 나누는 기준은 스레드 수가 아니라 기능입니다.
확인한 뒤 되돌립니다.
"""
answer_en = """
Two workers can share one `logger` and the lines still do not mix, because one log thread writes them. `snapshot()` holds the lines of both workers in time order. Without `flush()`, the last two lines printed directly with `std::cout` can come **before** log lines that have not been delivered yet (it differs from run to run). `flush()` waits until every line written before the call is out.
A Logger per feature is still useful because of the **settings**. For example, connect the slow worker to a `slow_logger` made with `Logger::Config{ .liveOutput = &slow_file }` (`slow_file` is a `std::ofstream`), and only the slow worker's log goes to the file while the rest goes to the screen. The history size (`bufferCapacity`) can also differ per feature. You split by feature, not by thread count.
Reset the file when you are done.
"""

[[exercise]]
id       = "legacy_period"
title    = "예전 방식의 주기를 500ms로"
title_en = "Make the old worker's period 500 ms"
source   = [{ file = "main.cpp", has = ['\b500\b'] }]
expect   = ['^legacy stop took \d+ ms \(period 500 ms\)']
fail_hint    = "main.cpp 위쪽의 kPeriod{100}을 kPeriod{500}으로 바꾸세요. 출력이 'legacy stop took … ms (period 500 ms)'가 되어야 합니다."
fail_hint_en = "Change kPeriod{100} near the top of main.cpp to kPeriod{500}. The output must become 'legacy stop took … ms (period 500 ms)'."
hint = """
`main.cpp` 위쪽 익명 namespace의 `kPeriod`가 1단계와 2단계의 주기입니다. 숫자만 바꾸고 Run을 누르세요.
`legacy stop took … ms`와 `jthread stop took … ms`를 나란히 보세요. 1단계의 값은 `kPeriod`에서 무엇을 뺀 값에 가까운가요?
"""
hint_en = """
`kPeriod` in the anonymous namespace near the top of `main.cpp` is the period of Steps 1 and 2. Change only the number and press Run.
Compare `legacy stop took … ms` with `jthread stop took … ms`. What is the Step 1 value close to, in terms of `kPeriod`?
"""
answer = """
```cpp
constexpr std::chrono::milliseconds kPeriod{500};
```
```text
legacy stop took 485 ms (period 500 ms)
jthread stop took 0 ms
```
예전 방식의 정지 시간은 `kPeriod - kHeadStart`(500 - 15)에 가깝고(Windows는 대기 정밀도 때문에 500쯤까지 나오기도 합니다), 주기에 **비례**합니다. 정지 요청이 오면 스레드는 남은 잠을 다 자야 플래그를 봅니다. `std::jthread`는 대기 중에 깨우므로 주기와 무관하게 0–몇 ms입니다. 그래서 예전 방식에서는 "빨리 멈추고 싶으면 주기를 줄여라"가 되고(CPU를 더 씀), `stop_token`에서는 주기를 마음대로 길게 잡아도 종료가 느려지지 않습니다.
확인한 뒤 되돌립니다.
"""
answer_en = """
```cpp
constexpr std::chrono::milliseconds kPeriod{500};
```
```text
legacy stop took 485 ms (period 500 ms)
jthread stop took 0 ms
```
The old worker's stop time is close to `kPeriod - kHeadStart` (500 - 15; on Windows the waiting precision can make it come out near 500) and **grows with** the period. When the stop request comes, the thread has to sleep out the rest of its sleep before it sees the flag. The `std::jthread` wakes the wait, so it takes 0 to a few ms whatever the period. So with the old way "to stop sooner, shorten the period" (and use more CPU), while with a `stop_token` you can make the period as long as you like and shutdown stays fast.
Reset the file when you are done.
"""

[[exercise]]
id       = "remove_join"
title    = "~LegacyWorker의 join() 지워 보기"
title_en = "Remove join() from ~LegacyWorker"
exit     = "nonzero"
source   = [{ file = "legacy_worker.hpp", lacks = ['thread_\.join\(\)'] }]
fail_hint    = "~LegacyWorker 안의 if (thread_.joinable()) { thread_.join(); } 를 통째로 지우세요."
fail_hint_en = "Remove the whole if (thread_.joinable()) { thread_.join(); } inside ~LegacyWorker."
hint = """
연습 사본의 `legacy_worker.hpp`에서 소멸자 `~LegacyWorker`의 `thread_.join();` 호출(과 그것을 감싼 `if`)을 지우고 Run을 누르세요.
1단계가 끝나는 곳(블록의 닫는 중괄호)에서 무슨 일이 일어나는지 보세요. `std::thread` 멤버가 소멸할 때 스레드가 어떤 상태인지 생각해 보세요.
"""
hint_en = """
In the practice copy of `legacy_worker.hpp`, remove the `thread_.join();` call (and the `if` around it) from the destructor `~LegacyWorker`, and press Run.
See what happens where Step 1 ends (the closing brace of the block). Think about what state the thread is in when the `std::thread` member is destroyed.
"""
answer = """
```cpp
~LegacyWorker() {
    requestStop();   // join()이 없다: thread_는 joinable()인 채 소멸한다
}
```
프로그램은 1단계에서 `abort`로 끝납니다(웹·Linux는 `terminate called without an active exception`을 찍고 신호 `SIGABRT`, 셸 종료 코드 134. Windows: 종료 코드 3. Debug 빌드는 stderr에 `abort() has been called`를 찍고, 디버거로 실행하면 대화상자를 띄웁니다). 2단계 이후는 돌지 않습니다.
`std::thread`는 소멸할 때 `joinable()`이면 `std::terminate()`를 부릅니다. 스레드가 곧 끝날 것이어도 마찬가지입니다. 라이브러리가 "아직 안 끝난 일을 몰래 기다리거나 버리지" 않고 프로그램을 멈추게 한 것입니다. `std::jthread`는 소멸자가 `request_stop()`과 `join()`을 대신 하므로 이 일이 생기지 않습니다.
확인한 뒤 되돌립니다.
"""
answer_en = """
```cpp
~LegacyWorker() {
    requestStop();   // no join(): thread_ is destroyed while joinable()
}
```
The program ends with `abort` in Step 1 (web and Linux print `terminate called without an active exception` and get signal `SIGABRT`, shell exit code 134. Windows: exit code 3. A Debug build prints `abort() has been called` on stderr, and run under a debugger it shows a dialog instead). Step 2 and later never run.
A `std::thread` destroyed while `joinable()` calls `std::terminate()`, even if the thread is about to end. The library chose to stop the program instead of silently waiting for unfinished work or dropping it. A `std::jthread` does `request_stop()` and `join()` in its destructor, so this cannot happen.
Reset the file when you are done.
"""
