# Exercises of this lesson (spec 070-20): the README's "연습" items, in the same order (item 3 is split into 3_a and 3_b).
# The page checks them after every practice run; `py -3 tools/exercises.py check format_text --preset <p>` does the same locally.

[[exercise]]
id       = "drop_format_arg"
title    = "format 인자 하나 지우고 오류 읽기"
title_en = "Drop one format argument and read the error"
build    = "fail"
build_expect = ['consteval|constant expression|format string|C7595|C2131|C7595']
fail_hint    = "3단계 첫 std::format(...) 호출에서 인자 kNumber 하나를 지워 인자 수가 {} 수보다 적게 만드세요."
fail_hint_en = "In part 3's first std::format(...) call, delete one kNumber argument so there are fewer arguments than {} fields."
hint = '''
3단계의 `std::format("dec: {}, hex: {:#x}, oct: {:#o}, bin: {:012b}\n", …)`에는 `{}`가 넷, 인자(`kNumber`)도 넷입니다. 인자를 하나 지우고 Run을 누르세요.
오류 메시지 안에서 `consteval`, `format_string`, `constant expression` 같은 낱말을 찾아보세요. 검사를 하는 쪽은 런타임 함수가 아니라 `std::format_string`의 생성자입니다.
'''
hint_en = '''
Part 3's `std::format("dec: {}, hex: {:#x}, oct: {:#o}, bin: {:012b}\n", …)` has four `{}` fields and four arguments (`kNumber`). Delete one argument and press Run.
Look for words such as `consteval`, `format_string` and `constant expression` in the message. The check is done not by a runtime function but by the constructor of `std::format_string`.
'''
answer = '''
```cpp
    std::cout << std::format("dec: {}, hex: {:#x}, oct: {:#o}, bin: {:012b}\n",
                             kNumber, kNumber, kNumber);   // 인자 하나가 모자란다
```
`std::format`의 첫 매개변수는 `std::format_string<Args...>`이고, 그 생성자는 `consteval`입니다. 그래서 형식 문자열을 **컴파일 시간**에 `Args...`에 맞춰 파싱하고, 맞지 않으면 "상수 식이 아님"(Clang) 또는 `C7595`·`C2131`(MSVC) 같은 오류가 납니다. 실행 중에 `printf`처럼 이상한 값을 찍는 일은 없습니다.
인자를 하나 **더** 넣으면 컴파일됩니다. 표준은 남는 인자를 오류로 보지 않고 그냥 쓰지 않습니다(`{}` 수가 더 많을 때만 오류). 확인한 뒤 되돌립니다.
'''
answer_en = '''
```cpp
    std::cout << std::format("dec: {}, hex: {:#x}, oct: {:#o}, bin: {:012b}\n",
                             kNumber, kNumber, kNumber);   // one argument short
```
The first parameter of `std::format` is a `std::format_string<Args...>`, and its constructor is `consteval`. It parses the format string against `Args...` at **compile time**, and a mismatch is an error ("not a constant expression" on Clang, `C7595` or `C2131` on MSVC). Nothing odd is printed at run time as `printf` would.
Passing one argument **more** compiles: the standard does not treat an unused extra argument as an error (only more `{}` fields than arguments is one). Reset the file when you are done.
'''

[[exercise]]
id       = "polar_formatter"
title    = "Vec2 formatter에 {:p}(극좌표) 더하기"
title_en = "Add {:p} (polar) to the Vec2 formatter"
build    = "ok"
exit     = 0
source   = [{ file = "main.cpp", has = ['\{:p\}', 'std::hypot', 'std::atan2'] }]
fail_hint    = "main의 4단계에 {:p}로 Vec2를 찍는 호출을 더하고, formatter가 p를 읽어 std::hypot과 std::atan2로 (r, θ)를 쓰게 하세요."
fail_hint_en = "Add a {:p} call for Vec2 to part 4 of main, and make the formatter read p and write (r, θ) with std::hypot and std::atan2."
hint = '''
`std::formatter<Vec2>`의 `parse`는 지금 `.N`만 읽습니다. 지정자 문자 하나를 더 읽고 그 결과를 멤버에 기억해 두면, `format`이 그 멤버를 보고 두 값을 다른 식으로 계산해 쓸 수 있습니다. 닫는 `}`를 소비하지 않고 끝나야 한다는 규칙은 그대로입니다.
극좌표의 반지름과 각도는 `<cmath>`의 함수 두 개로 구합니다(README의 안내). 4단계에 `{:p}`로 `point`를 찍는 줄을 더해 확인하세요.
'''
hint_en = '''
`parse` of `std::formatter<Vec2>` reads only `.N` now. Read one more specifier character and remember the result in a member; then `format` can look at that member and compute the two values differently. The rule that parsing must stop without consuming the closing `}` stays.
The radius and the angle of a polar coordinate come from two functions of `<cmath>` (see the README). Add a line to part 4 that prints `point` with `{:p}` to check.
'''
answer = '''
```cpp
template <>
struct std::formatter<Vec2> {
    int precision{-1};
    bool polar{false};

    constexpr auto parse(std::format_parse_context& ctx) {
        auto it = ctx.begin();
        const auto end = ctx.end();
        if (it != end && *it == '.') {
            ++it;
            if (it == end || *it < '0' || *it > '9') {
                throw std::format_error("invalid precision in Vec2 format");
            }
            precision = *it - '0';
            ++it;
        }
        if (it != end && *it == 'p') {
            polar = true;
            ++it;
        }
        if (it != end && *it != '}') {
            throw std::format_error("invalid format specifier for Vec2");
        }
        return it;
    }

    auto format(const Vec2& v, std::format_context& ctx) const {
        const double a = polar ? std::hypot(v.x, v.y) : v.x;
        const double b = polar ? std::atan2(v.y, v.x) : v.y;
        if (precision >= 0) {
            return std::format_to(ctx.out(), "({0:.{1}f}, {2:.{1}f})", a, precision, b);
        }
        return std::format_to(ctx.out(), "({}, {})", a, b);
    }
};
```
4단계에 `std::cout << std::format("polar: {:p}\n", point);`를 더합니다. 출력은 `polar: (2.704…, -0.982…)`입니다(`<cmath>` include 필요). `parse`는 `constexpr`이고 형식 문자열은 컴파일 시간에 검사되므로, `{:x}` 같은 모르는 지정자는 `format_error`가 되어 **컴파일 오류**입니다. 확인한 뒤 되돌립니다.
'''
answer_en = '''
```cpp
template <>
struct std::formatter<Vec2> {
    int precision{-1};
    bool polar{false};

    constexpr auto parse(std::format_parse_context& ctx) {
        auto it = ctx.begin();
        const auto end = ctx.end();
        if (it != end && *it == '.') {
            ++it;
            if (it == end || *it < '0' || *it > '9') {
                throw std::format_error("invalid precision in Vec2 format");
            }
            precision = *it - '0';
            ++it;
        }
        if (it != end && *it == 'p') {
            polar = true;
            ++it;
        }
        if (it != end && *it != '}') {
            throw std::format_error("invalid format specifier for Vec2");
        }
        return it;
    }

    auto format(const Vec2& v, std::format_context& ctx) const {
        const double a = polar ? std::hypot(v.x, v.y) : v.x;
        const double b = polar ? std::atan2(v.y, v.x) : v.y;
        if (precision >= 0) {
            return std::format_to(ctx.out(), "({0:.{1}f}, {2:.{1}f})", a, precision, b);
        }
        return std::format_to(ctx.out(), "({}, {})", a, b);
    }
};
```
Add `std::cout << std::format("polar: {:p}\n", point);` to part 4. The output is `polar: (2.704…, -0.982…)` (`<cmath>` is needed). `parse` is `constexpr` and the format string is checked at compile time, so an unknown specifier such as `{:x}` is a `format_error` and therefore a **compile error**. Reset the file when you are done.
'''

[[exercise]]
id       = "println_a"
title    = "2단계 표를 std::println으로 다시 쓰기"
title_en = "Rewrite the part 2 table with std::println"
build    = "ok"
source   = [{ file = "main.cpp", lacks = ['std::cout\s*<<\s*formatRow\(row\)', 'std::cout\s*<<\s*std::format\("\{:<10\}'] }]
fail_hint    = "2단계의 std::cout << formatRow(row) 줄과 제목 줄 std::cout << std::format(\"{:<10} ...\")을 std::println(...)으로 바꾸세요."
fail_hint_en = "Replace part 2's std::cout << formatRow(row) line and the header line std::cout << std::format(\"{:<10} ...\") with std::println(...)."
hint = '''
`std::println`은 끝에 줄바꿈을 붙이므로 `<<`와 `'\n'`이 사라집니다. 제목 줄, 구분선, 행 출력 세 곳을 모두 바꾸세요. 구분선은 `"{:-<10}-+-{:->6}-+-{:->7}"`입니다.
`<print>`는 이미 include되어 있습니다. 출력은 그대로여야 합니다.
'''
hint_en = '''
`std::println` appends the newline, so `<<` and `'\n'` disappear. Change all three: the header line, the separator line and the row output. The separator is `"{:-<10}-+-{:->6}-+-{:->7}"`.
`<print>` is already included. The output must stay the same.
'''
answer = '''
```cpp
    std::println("{:<10} | {:>6} | {:>7}", "name", "count", "share");
    std::println("{:-<10}-+-{:->6}-+-{:->7}", "", "", "");
    for (const auto& row : kRows) {
        std::println("{}", formatRow(row));
    }
```
출력은 처음과 같습니다. 줄 끝 `\n`을 직접 쓰지 않으니 빼먹을 일이 없고, `std::cout << std::format(...)`처럼 임시 `std::string`을 거치지 않고 스트림에 바로 씁니다. 7단계에서 이미 `std::println("{}", formatRow(kRows[0]));`를 쓰므로, 파일 전체에서 `std::println`이 있는지로는 풀었는지 알 수 없습니다. 확인한 뒤 되돌립니다.
'''
answer_en = '''
```cpp
    std::println("{:<10} | {:>6} | {:>7}", "name", "count", "share");
    std::println("{:-<10}-+-{:->6}-+-{:->7}", "", "", "");
    for (const auto& row : kRows) {
        std::println("{}", formatRow(row));
    }
```
The output is the same as before. You do not write the trailing `\n` yourself, so you cannot forget it, and the text goes straight to the stream without the temporary `std::string` of `std::cout << std::format(...)`. Part 7 already uses `std::println("{}", formatRow(kRows[0]));`, so a `std::println` somewhere in the file does not tell whether you solved this. Reset the file when you are done.
'''

[[exercise]]
id       = "println_b"
title    = "std::println에 런타임 형식 문자열을 넘겨 오류 읽기"
title_en = "Pass a runtime format string to std::println and read the error"
build    = "fail"
build_expect = ['consteval|constant expression|format string|not usable|C7595|C2131|C2665|C2672']
source   = [{ file = "main.cpp", has = ['std::println\(bad_pattern'] }]
fail_hint    = "6단계의 bad_pattern을 std::println(bad_pattern, word); 로 넘기는 줄을 더하세요."
fail_hint_en = "Add a line that passes part 6's bad_pattern as std::println(bad_pattern, word);."
hint = '''
`bad_pattern`은 `const std::string_view` 변수입니다. `std::println(bad_pattern, word);` 한 줄을 6단계의 `try` 앞이나 뒤에 더하고 Run을 누르세요.
`std::println`의 첫 매개변수 타입이 `std::format_string<Args...>`라서 `std::format`과 같은 이유로 거절됩니다.
'''
hint_en = '''
`bad_pattern` is a `const std::string_view` variable. Add the single line `std::println(bad_pattern, word);` before or after part 6's `try` and press Run.
The first parameter of `std::println` is a `std::format_string<Args...>`, so it is rejected for the same reason as `std::format`.
'''
answer = '''
```cpp
    std::println(bad_pattern, word);   // 컴파일 오류: 런타임 문자열은 format_string이 될 수 없다
```
`std::print`와 `std::println`도 `std::format_string`을 받으므로 형식 문자열은 컴파일 시간 상수여야 합니다. 실행 시간에 만든 형식은 `std::vformat`으로 문자열을 만든 뒤 출력하거나, 출력까지 한 번에 하는 `std::vprint_unicode`(`std::vprint_nonunicode`)에 `std::make_format_args`와 함께 넘깁니다. 확인한 뒤 되돌립니다.
'''
answer_en = '''
```cpp
    std::println(bad_pattern, word);   // compile error: a runtime string cannot become a format_string
```
`std::print` and `std::println` also take a `std::format_string`, so the format string must be a compile-time constant. A format built at run time goes through `std::vformat` to make a string and then printed, or through `std::vprint_unicode` (`std::vprint_nonunicode`), which prints in one go, with `std::make_format_args`. Reset the file when you are done.
'''
