# Exercises of this lesson (spec 070-21): the README's "연습" items, in the same order.
# The page checks them after every practice run; `py -3 tools/exercises.py check copy_and_move --preset <p>` does the same locally.

[[exercise]]
id       = "delete_copy"
title    = "Tracked의 복사 생성자를 = delete하고 오류 읽기"
title_en = "Delete Tracked's copy constructor and read the error"
build    = "fail"
build_expect = ['deleted|C2280']
source   = [{ file = "main.cpp", has = ['Tracked\(const Tracked&\)\s*=\s*delete'] }]
fail_hint    = "class Tracked의 복사 생성자 Tracked(const Tracked&) { ++copies_; } 전체를 Tracked(const Tracked&) = delete; 로 바꾸세요."
fail_hint_en = "Replace the whole copy constructor Tracked(const Tracked&) { ++copies_; } of class Tracked with Tracked(const Tracked&) = delete;."
hint = '''
`Tracked(const Tracked&) { ++copies_; }`를 `Tracked(const Tracked&) = delete;`로 바꾸고 Run하세요. 오류가 나는 줄은 `Tracked`가 아니라 그것을 **쓰는** 쪽입니다. 어느 줄들인가요? 값으로 받는 함수에 왼값을 주면 무엇이 필요한가요?
'''
hint_en = '''
Replace `Tracked(const Tracked&) { ++copies_; }` with `Tracked(const Tracked&) = delete;` and Run. The error lines are not in `Tracked` but where it is **used**. Which lines are they? What does passing an lvalue to a function that takes its argument by value need?
'''
answer = '''
```cpp
    Tracked(const Tracked&) = delete;
```
오류는 `takeByValue(a);`(1단계 첫 호출)에서 납니다: Clang `call to deleted constructor of 'Tracked'`, MSVC `C2280: … attempting to reference a deleted function`. 값으로 받는 매개변수를 왼값 `a`로 만들려면 복사 생성자가 필요한데 삭제되었기 때문입니다. 이동은 되므로 `takeByValue(std::move(a));`와 `takeByValue(makeTracked());`는 그대로 컴파일됩니다. `= delete`는 "이 클래스는 복사하면 안 된다"를 문서가 아니라 컴파일러에게 맡기는 방법입니다. 확인한 뒤 되돌립니다.
'''
answer_en = '''
```cpp
    Tracked(const Tracked&) = delete;
```
The error is at `takeByValue(a);` (the first call of step 1): Clang `call to deleted constructor of 'Tracked'`, MSVC `C2280: … attempting to reference a deleted function`. Making the by-value parameter from the lvalue `a` needs a copy constructor, and it is deleted. Moving still works, so `takeByValue(std::move(a));` and `takeByValue(makeTracked());` compile unchanged. `= delete` leaves "this class must not be copied" to the compiler instead of to documentation. Reset the file when you are done.
'''

[[exercise]]
id       = "moved_from"
title    = "이동한 뒤 원본 a의 상태 출력"
title_en = "Print the state of a after it has been moved from"
build    = "ok"
exit     = 0
source   = [{ file = "main.cpp", has = ['^\s*std::cout.*movedFrom\(\)'] }]
fail_hint    = "1단계 takeByValue(std::move(a)); 바로 아래에 std::cout으로 a.movedFrom()을 출력하는 줄을 더하세요."
fail_hint_en = "Add a line right below takeByValue(std::move(a)); in step 1 that prints a.movedFrom() with std::cout."
hint = '''
`takeByValue(std::move(a));` 바로 아래에서 `std::cout`으로 `a.movedFrom()`을 출력하고 Run하세요(`std::boolalpha`가 켜져 있어 `true`/`false`로 나옵니다). `movedFrom()`은 이 레슨의 `Tracked`가 이동 생성자에서 원본에 표시해 두는 값입니다.
'''
hint_en = '''
Print `a.movedFrom()` with `std::cout` right below `takeByValue(std::move(a));` and Run (`std::boolalpha` is on, so it prints `true`/`false`). `movedFrom()` is a mark that this lesson's `Tracked` sets on the original in its move constructor.
'''
answer = '''
```cpp
    takeByValue(std::move(a));
    std::cout << "a moved-from: " << a.movedFrom() << '\n';
```
출력은 `a moved-from: true`입니다. `std::move`는 아무것도 옮기지 않고 `a`를 "옮겨도 되는 값"으로 **표시**할 뿐이고, 실제로 옮기는 것은 `takeByValue`의 매개변수를 만드는 이동 생성자입니다. 이동한 뒤의 `a`는 **유효하지만 지정되지 않은 상태**: 소멸하거나 새 값을 대입하는 것은 안전하지만 값이 무엇인지는 타입이 정하기 나름입니다. 이 레슨은 `Tracked`처럼 레슨이 직접 정의한 타입의 이동 후 상태만 찍습니다. `std::string`은 이동 뒤 비어 있는 것이 보통이지만 표준이 값을 보장하지 않으므로 그 값에 기대지 않습니다. 확인한 뒤 되돌립니다.
'''
answer_en = '''
```cpp
    takeByValue(std::move(a));
    std::cout << "a moved-from: " << a.movedFrom() << '\n';
```
The output is `a moved-from: true`. `std::move` moves nothing: it only **marks** `a` as "a value that may be moved from", and what really moves is the move constructor that makes `takeByValue`'s parameter. After the move `a` is in a **valid but unspecified state**: destroying it or assigning a new value is safe, but what the value is, is up to the type. This lesson prints the moved-from state only for types the lesson defines itself, like `Tracked`. A moved-from `std::string` is usually empty, but the standard does not guarantee the value, so do not rely on it. Reset the file when you are done.
'''

[[exercise]]
id       = "no_noexcept"
title    = "IntBox 이동 생성자의 noexcept를 빼고 재할당 보기"
title_en = "Remove noexcept from IntBox's move constructor and watch reallocation"
build    = "ok"
exit     = 0
expect   = ['^relocation used only moves: false']
source   = [{ file = "main.cpp", lacks = ['IntBox\(IntBox&&\s*other\)\s*noexcept'] }]
fail_hint    = "class IntBox의 이동 생성자 IntBox(IntBox&& other) noexcept 에서 noexcept만 지우세요(이동 대입 연산자는 그대로)."
fail_hint_en = "Remove only noexcept from the move constructor IntBox(IntBox&& other) noexcept of class IntBox (leave the move assignment alone)."
hint = '''
이동 **생성자**의 `noexcept`만 지우세요. 3단계 마지막의 `relocation used only moves` 줄이 바뀝니다. `std::vector`는 재할당할 때 원소를 새 저장소로 옮기는데, 도중에 예외가 나면 원래 상태로 되돌려야 합니다. 이동이 예외를 던질 수 있다면 `std::vector`는 어떻게 하는 편이 안전할까요?
'''
hint_en = '''
Remove `noexcept` from the move **constructor** only. The `relocation used only moves` line at the end of step 3 changes. When a `std::vector` reallocates it moves its elements into the new storage, and if an exception is thrown halfway it has to restore the original state. If a move may throw, what is safer for `std::vector` to do?
'''
answer = '''
```cpp
    IntBox(IntBox&& other) : value_(std::exchange(other.value_, nullptr)) {
        ++moves_;
    }
```
출력은 `relocation used only moves: false`로 바뀝니다. `std::vector`는 재할당 때 `std::move_if_noexcept`로 원소를 옮깁니다: 이동 생성자가 `noexcept`가 **아니고** 복사 생성자가 있으면 **복사**를 고릅니다. 이동 도중 예외가 나면 이미 옮긴 원소를 되돌릴 수 없지만, 복사는 원본이 그대로이므로 강한 예외 보장을 지킬 수 있기 때문입니다. 그래서 자원을 넘기기만 하는 이동 연산에는 `noexcept`를 붙입니다(Rule of 0이면 컴파일러가 알아서 붙임). 확인한 뒤 되돌립니다.
'''
answer_en = '''
```cpp
    IntBox(IntBox&& other) : value_(std::exchange(other.value_, nullptr)) {
        ++moves_;
    }
```
The output changes to `relocation used only moves: false`. On reallocation `std::vector` moves its elements with `std::move_if_noexcept`: when the move constructor is **not** `noexcept` and a copy constructor exists, it **copies**. If a move throws halfway, the elements already moved cannot be put back, but a copy leaves the original intact, so the strong exception guarantee can be kept. That is why a move operation that only hands over a resource gets `noexcept` (with the Rule of 0 the compiler adds it for you). Reset the file when you are done.
'''
