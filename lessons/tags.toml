# Tag vocabulary (spec 070-10 §2.2). A lesson's `tags` use only the keys below.
# ko / en: the name the page shows in each language. aliases: other words that find the tag in
# the page's search (C++ names, the other language's words). A name may belong to one tag only, so a C++
# feature that will get its own lesson (std::variant, smart pointers) is left for that lesson's tag.

[lambda]
ko      = "람다"
en      = "Lambda"
aliases = ["closure", "클로저", "function object", "함수 객체", "std::move_only_function", "std::function"]

[capture]
ko      = "캡처"
en      = "Capture"
aliases = ["init capture", "this capture", "캡처 방식", "mutable"]

[move]
ko      = "이동"
en      = "Move semantics"
aliases = ["std::move", "move-only", "이동 의미론"]

[thread]
ko      = "스레드"
en      = "Thread"
aliases = ["std::thread", "std::jthread", "jthread", "std::stop_token", "concurrency", "동시성"]

[log]
ko      = "로그"
en      = "Logging"
aliases = ["logger", "로거", "로깅"]

[performance]
ko      = "성능"
en      = "Performance"
aliases = ["benchmark", "벤치마크", "profiling", "프로파일링"]

[span]
ko      = "구간 시간"
en      = "Span timing"
aliases = ["timeScope", "recordSpan", "SpanMeter", "timing", "시간 측정"]

[tracer]
ko      = "Tracer"
en      = "Tracer"
aliases = ["visualizer", "시각화", "diagram", "다이어그램", "mermaid", "트레이서"]

[state]
ko      = "상태"
en      = "State"
aliases = ["state machine", "상태 머신", "state pattern", "FSM"]

[format]
ko      = "포맷"
en      = "Formatting"
aliases = ["std::format", "std::print", "std::formatter", "std::vformat", "std::format_to", "printf", "fmt", "포맷팅", "문자열 포맷"]

[error]
ko      = "오류 처리"
en      = "Error handling"
aliases = ["std::expected", "std::unexpected", "Expected", "Result", "CoreError", "exception", "예외", "오류", "and_then", "or_else"]

[source_location]
ko      = "호출 위치"
en      = "Source location"
aliases = ["std::source_location", "__FILE__", "__LINE__", "__func__", "FormatWithLocation", "호출 위치 기록"]

[recovery]
ko      = "로그 복구"
en      = "Log recovery"
aliases = ["crash dump", "크래시 덤프", "logmap", "mappedDir", "memory-mapped", "메모리 매핑", "SIGKILL", "복구"]
